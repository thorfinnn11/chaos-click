<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="600" cy="200" r="450" fill="url(#amberGlow)"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#121212" fill-opacity="0.9"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#252525" stroke-width="1"/>

  <!-- Logo -->
  <text x="60" y="44" fill="#F59E0B" font-size="22" font-weight="900" letter-spacing="2">HALCYON</text>
  <circle cx="180" cy="38" r="4" fill="#10B981"/>
  <text x="195" y="42" fill="#8d8d8d" font-size="12">STABLE // STAGE 0</text>

  <!-- Nav links -->
  <text x="440" y="43" fill="#9CA3AF" font-size="14">Product</text>
  <text x="520" y="43" fill="#9CA3AF" font-size="14">Teams</text>
  <text x="590" y="43" fill="#9CA3AF" font-size="14">Pricing</text>
  <text x="665" y="43" fill="#9CA3AF" font-size="14">Customers</text>

  <!-- Nav actions -->
  <text x="1000" y="43" fill="#D1D5DB" font-size="14">Sign in</text>
  <rect x="1065" y="22" width="95" height="34" rx="17" fill="url(#btnGrad)"/>
  <text x="1080" y="44" fill="#000000" font-size="12" font-weight="700">Get Started</text>

  <!-- Eyebrow Pill -->
  <rect x="460" y="110" width="280" height="28" rx="14" fill="#202020" stroke="#333333"/>
  <circle cx="478" cy="124" r="4" fill="#F59E0B"/>
  <text x="492" y="128" fill="#FBBF24" font-size="11" font-weight="600" letter-spacing="1">WORKPLACE WELLBEING &amp; DEEP WORK</text>

  <!-- Main Headline -->
  <text x="600" y="180" fill="#F3F4F6" font-size="44" font-weight="800" text-anchor="middle">Help your team find its focus.</text>

  <!-- Subheadline -->
  <text x="600" y="215" fill="#9CA3AF" font-size="16" text-anchor="middle">Halcyon shows where attention goes during the workday and nudges people toward deep work,</text>
  <text x="600" y="238" fill="#9CA3AF" font-size="16" text-anchor="middle">with calm check-ins instead of constant pings.</text>

  <!-- CTA Buttons -->
  <g transform="translate(470, 265)">
    <rect x="0" y="0" width="165" height="46" rx="23" fill="url(#btnGrad)"/>
    <text x="82" y="28" fill="#000000" font-size="14" font-weight="800" text-anchor="middle">Start free trial</text>
  </g>
  <g transform="translate(650, 265)">
    <rect x="0" y="0" width="175" height="46" rx="23" fill="#202020" stroke="#3a3a3a"/>
    <text x="87" y="28" fill="#F3F4F6" font-size="13" font-weight="600" text-anchor="middle">Watch 2-min demo</text>
  </g>
  <text x="600" y="332" fill="#6B7280" font-size="12" text-anchor="middle">No credit card. Cancel anytime. From $6/seat/month.</text>

  <!-- Trust Line -->
  <text x="600" y="375" fill="#4B5563" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">TRUSTED BY 1,200 TEAMS ACROSS 40 COUNTRIES</text>
  <text x="600" y="402" fill="#6B7280" font-size="14" letter-spacing="8" text-anchor="middle">NORTHWIND   •   LUMEN   •   FIELDSTONE   •   PARALLEL   •   ARDENT</text>

  <!-- Three Feature Cards -->
  <g transform="translate(60, 435)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="150" rx="8" fill="#181818" stroke="#2c2c2c"/>
    <circle cx="36" cy="36" r="16" fill="#252525"/>
    <text x="36" y="41" fill="#F59E0B" font-size="16" text-anchor="middle">⏱</text>
    <text x="65" y="40" fill="#F3F4F6" font-size="16" font-weight="700">Focus time</text>
    <text x="24" y="75" fill="#9CA3AF" font-size="13">See when your team does its best</text>
    <text x="24" y="96" fill="#9CA3AF" font-size="13">work, and protect it with auto-blocks.</text>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="150" rx="8" fill="#181818" stroke="#2c2c2c"/>
    <circle cx="406" cy="36" r="16" fill="#252525"/>
    <text x="406" y="41" fill="#F59E0B" font-size="16" text-anchor="middle">🌱</text>
    <text x="435" y="40" fill="#F3F4F6" font-size="16" font-weight="700">Gentle check-ins</text>
    <text x="394" y="75" fill="#9CA3AF" font-size="13">Short, optional prompts that take ten</text>
    <text x="394" y="96" fill="#9CA3AF" font-size="13">seconds to gauge momentum.</text>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="150" rx="8" fill="#181818" stroke="#2c2c2c"/>
    <circle cx="776" cy="36" r="16" fill="#252525"/>
    <text x="776" y="41" fill="#F59E0B" font-size="16" text-anchor="middle">📊</text>
    <text x="805" y="40" fill="#F3F4F6" font-size="16" font-weight="700">Team insights</text>
    <text x="764" y="75" fill="#9CA3AF" font-size="13">Weekly summaries, aggregated and</text>
    <text x="764" y="96" fill="#9CA3AF" font-size="13">strictly anonymous at company scale.</text>
  </g>

  <!-- Footer preview -->
  <text x="60" y="640" fill="#4B5563" font-size="11">© 2026 Halcyon Labs Inc. • Privacy • Security • Terms</text>
  <text x="1140" y="640" fill="#4B5563" font-size="11" text-anchor="end">Status: All systems operational</text>
</svg>
