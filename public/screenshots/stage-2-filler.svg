<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#131313; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="amberGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#131313" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <circle cx="600" cy="220" r="450" fill="url(#amberGlow2)"/>

  <!-- Top Nav -->
  <rect x="0" y="0" width="1200" height="70" fill="#151515"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#2c2c2c" stroke-width="1"/>
  <text x="60" y="44" fill="#F59E0B" font-size="22" font-weight="900" letter-spacing="2">HALCYON</text>
  <rect x="180" y="27" width="165" height="22" rx="4" fill="#202020" stroke="#3a3a3a"/>
  <text x="190" y="42" fill="#FBBF24" font-size="11" font-weight="700">CHAOS 33% // STEP 2 (FILLER)</text>

  <!-- Eyebrow Pill -->
  <rect x="420" y="110" width="360" height="28" rx="14" fill="#202020" stroke="#444444"/>
  <circle cx="438" cy="124" r="4" fill="#F59E0B"/>
  <text x="452" y="128" fill="#F59E0B" font-size="11" font-weight="600" letter-spacing="1">PRESENCE VERIFICATION &amp; IDLE DETECTION</text>

  <!-- Headline -->
  <text x="600" y="180" fill="#F3F4F6" font-size="40" font-weight="800" text-anchor="middle">Monitor where your team's attention goes.</text>

  <!-- Subheadline -->
  <text x="600" y="215" fill="#9CA3AF" font-size="16" text-anchor="middle">Halcyon records employee presence throughout the workday and optimizes output,</text>
  <text x="600" y="238" fill="#9CA3AF" font-size="16" text-anchor="middle">with periodic compliance checks and response latency sampling.</text>

  <!-- CTA Button -->
  <g transform="translate(500, 265)">
    <rect x="0" y="0" width="200" height="46" rx="23" fill="#F59E0B"/>
    <text x="100" y="28" fill="#000000" font-size="14" font-weight="800" text-anchor="middle">Proceed to step 2 →</text>
  </g>
  <text x="600" y="332" fill="#71717A" font-size="12" text-anchor="middle">Telemetry interval: 8 minutes. Idle thresholds calibrated.</text>

  <!-- Three Updated Cards -->
  <g transform="translate(60, 390)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="150" rx="8" fill="#1a1a1a" stroke="#333333"/>
    <text x="24" y="40" fill="#F59E0B" font-size="16" font-weight="700">Focus metrics</text>
    <text x="24" y="75" fill="#9CA3AF" font-size="13">Identify non-compliant downtime</text>
    <text x="24" y="96" fill="#9CA3AF" font-size="13">and automatically redirect worker focus.</text>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="150" rx="8" fill="#1a1a1a" stroke="#333333"/>
    <text x="394" y="40" fill="#F59E0B" font-size="16" font-weight="700">Passive check-ins</text>
    <text x="394" y="75" fill="#9CA3AF" font-size="13">System queries keyboard response</text>
    <text x="394" y="96" fill="#9CA3AF" font-size="13">latency every eight minutes.</text>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="150" rx="8" fill="#1a1a1a" stroke="#333333"/>
    <text x="764" y="40" fill="#F59E0B" font-size="16" font-weight="700">Team reporting</text>
    <text x="764" y="75" fill="#9CA3AF" font-size="13">Manager notifications fire when</text>
    <text x="764" y="96" fill="#9CA3AF" font-size="13">attention drops below department quota.</text>
  </g>

  <!-- Testimonial Quote -->
  <g transform="translate(250, 565)">
    <rect x="0" y="0" width="700" height="65" rx="6" fill="#171717" stroke="#2c2c2c"/>
    <text x="350" y="28" fill="#D1D5DB" font-size="13" font-style="italic" text-anchor="middle">"Staff productivity increased once tracking commenced."</text>
    <text x="350" y="48" fill="#71717A" font-size="11" text-anchor="middle">— Operations Dept., Fieldstone Division</text>
  </g>
</svg>
