<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#080808; font-family: 'Courier New', monospace;">
  <defs>
    <radialGradient id="meltdownVignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A0D00" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#080808" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <filter id="meltdownShadow">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Ambient CRT Power-off Vignette -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#meltdownVignette)"/>

  <!-- CRT collapsed beam residual glow line across center -->
  <line x1="0" y1="337" x2="1200" y2="337" stroke="#F59E0B" stroke-width="1.5" opacity="0.3"/>

  <!-- Centered Meltdown Terminal Modal -->
  <g transform="translate(250, 75)" filter="url(#meltdownShadow)">
    <rect x="0" y="0" width="700" height="525" fill="#141414" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Top Modal Header -->
    <rect x="0" y="0" width="700" height="38" fill="#241400"/>
    <line x1="0" y1="38" x2="700" y2="38" stroke="#F59E0B" stroke-width="1"/>
    <text x="20" y="24" fill="#FBBF24" font-size="12" font-weight="900" letter-spacing="2">ROOM 101 // MELTDOWN CONCLUDED // ARTICLE 1984</text>
    <text x="680" y="24" fill="#EF4444" font-size="12" font-weight="900" text-anchor="end">STATUS: FINAL</text>

    <!-- Anton Huge Condensed Headline -->
    <text x="350" y="110" fill="#B45309" font-family="'Anton', Impact, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="2">AUDIT COMPLETE.</text>
    <text x="350" y="165" fill="#F59E0B" font-family="'Anton', Impact, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="2">YOU WERE NEVER ALONE.</text>

    <!-- Subtext -->
    <text x="350" y="208" fill="#D1D5DB" font-size="13" text-anchor="middle">Every keystroke, gaze hesitation, and compliance pulse has been archived.</text>
    <text x="350" y="228" fill="#9CA3AF" font-size="12" text-anchor="middle">The Ministry of Love acknowledges your cooperation in the labor quota.</text>

    <!-- Diagnostic Readout Box -->
    <g transform="translate(60, 255)">
      <rect x="0" y="0" width="580" height="150" fill="#0D0D0D" stroke="#333333"/>
      
      <text x="24" y="32" fill="#8d8d8d" font-size="12">SUBJECT_IDENTIFIER:</text>
      <text x="556" y="32" fill="#F3F4F6" font-size="12" font-weight="700" text-anchor="end">CITIZEN #6079-W (PROLE/DESK)</text>

      <text x="24" y="60" fill="#8d8d8d" font-size="12">TOTAL_CLICKS_DISCHARGED:</text>
      <text x="556" y="60" fill="#F59E0B" font-size="13" font-weight="900" text-anchor="end">06 / 06 (100% QUOTA EXCEEDED)</text>

      <text x="24" y="88" fill="#8d8d8d" font-size="12">THOUGHTCRIME_RATING:</text>
      <text x="556" y="88" fill="#EF4444" font-size="13" font-weight="900" text-anchor="end">CRITICAL // ROOM 101 PROTOCOL</text>

      <text x="24" y="116" fill="#8d8d8d" font-size="12">SURVEILLANCE_ACTION:</text>
      <text x="556" y="116" fill="#10B981" font-size="12" font-weight="700" text-anchor="end">REALITY REBOOT AUTHORIZED</text>
    </g>

    <!-- Reboot CTA Button: "Return to your desk" -->
    <g transform="translate(225, 435)">
      <rect x="0" y="0" width="250" height="52" rx="4" fill="#F59E0B" stroke="#FDE047" stroke-width="2"/>
      <text x="125" y="32" fill="#000000" font-family="'Anton', Impact, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">RETURN TO YOUR DESK</text>
    </g>

    <text x="350" y="508" fill="#71717A" font-size="10" text-anchor="middle">[ INITIATES REVERSE CRT POWER-ON TO STAGE 0 ]</text>
  </g>
</svg>
