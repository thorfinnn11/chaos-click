<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#111111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Glitch displacement filter -->
    <filter id="rgbShift">
      <feOffset in="SourceGraphic" dx="-2" dy="0" result="red"/>
      <feOffset in="SourceGraphic" dx="2" dy="0" result="blue"/>
      <feBlend in="red" in2="blue" mode="screen"/>
    </filter>
  </defs>

  <!-- Slight tilt transform for discomfort -->
  <g transform="rotate(0.4 600 337)">
    <!-- Top Nav -->
    <rect x="0" y="0" width="1200" height="65" fill="#141414"/>
    <line x1="0" y1="65" x2="1200" y2="65" stroke="#333333" stroke-width="1"/>
    <text x="60" y="42" fill="#F59E0B" font-size="22" font-weight="900" letter-spacing="2">HALCYON</text>
    <rect x="180" y="24" width="165" height="22" rx="4" fill="#291A00" stroke="#F59E0B"/>
    <text x="190" y="39" fill="#FBBF24" font-size="11" font-weight="700">CHAOS 50% // SURVEILLANCE</text>

    <!-- Eyebrow Pill -->
    <rect x="410" y="95" width="380" height="28" rx="14" fill="#221A10" stroke="#78350F"/>
    <circle cx="428" cy="109" r="4" fill="#F59E0B"/>
    <text x="442" y="113" fill="#FBBF24" font-size="11" font-weight="700" letter-spacing="1">SURVEILLANCE MANDATE // RECORD ARCHIVE</text>

    <!-- Headline with RGB Glitch offset -->
    <g filter="url(#rgbShift)">
      <text x="598" y="165" fill="#B45309" font-size="42" font-weight="900" text-anchor="middle">Know where your team's attention goes.</text>
      <text x="602" y="165" fill="#F59E0B" font-size="42" font-weight="900" text-anchor="middle">Know where your team's attention goes.</text>
    </g>

    <!-- Subheadline -->
    <text x="600" y="200" fill="#9CA3AF" font-size="15" text-anchor="middle">Active biometric feedback loops ensure remote personnel maintain continuous focus</text>
    <text x="600" y="222" fill="#9CA3AF" font-size="15" text-anchor="middle">during operational hours. Thought patterns recorded.</text>

    <!-- Primary Action Button -->
    <g transform="translate(510, 250)">
      <rect x="0" y="0" width="180" height="46" rx="23" fill="#D97706" stroke="#FBBF24" stroke-width="1.5"/>
      <text x="90" y="28" fill="#FFFFFF" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="1">Acknowledge</text>
    </g>

    <!-- Three Cards -->
    <g transform="translate(60, 325)">
      <rect x="0" y="0" width="340" height="135" rx="6" fill="#181818" stroke="#3d3d3d"/>
      <text x="24" y="35" fill="#F59E0B" font-size="15" font-weight="700">Focus metrics</text>
      <text x="24" y="65" fill="#9CA3AF" font-size="12">All idle moments cataloged permanently</text>
      <text x="24" y="85" fill="#9CA3AF" font-size="12">into Central Records repository.</text>

      <rect x="370" y="0" width="340" height="135" rx="6" fill="#181818" stroke="#3d3d3d"/>
      <text x="394" y="35" fill="#F59E0B" font-size="15" font-weight="700">Required check-ins</text>
      <text x="394" y="65" fill="#9CA3AF" font-size="12">Mandatory biometric acknowledgments</text>
      <text x="394" y="85" fill="#9CA3AF" font-size="12">prompted every 15 minutes.</text>

      <rect x="740" y="0" width="340" height="135" rx="6" fill="#181818" stroke="#3d3d3d"/>
      <text x="764" y="35" fill="#F59E0B" font-size="15" font-weight="700">Attributed &amp; archived</text>
      <text x="764" y="65" fill="#9CA3AF" font-size="12">All keystrokes and gaze vectors stored</text>
      <text x="764" y="85" fill="#9CA3AF" font-size="12">in permanent employee dossier.</text>
    </g>
  </g>

  <!-- Sticky Bottom Mandatory Cookie / Telemetry Banner -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="95" rx="8" fill="#1A1814" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="30" y="35" fill="#FBBF24" font-size="14" font-weight="800">⚠️ COMPLIANCE CONSENT NOTICE [MANDATORY]</text>
    <text x="30" y="58" fill="#D1D5DB" font-size="12">Halcyon requires continuous webcam gaze tracking, telemetry streaming, and application logging.</text>
    <text x="30" y="76" fill="#9CA3AF" font-size="11">Refusal constitutes breach of Oceania Section 14 labor directives.</text>
    <rect x="800" y="28" width="170" height="40" rx="4" fill="#F59E0B"/>
    <text x="885" y="53" fill="#000000" font-size="12" font-weight="800" text-anchor="middle">Acknowledge &amp; Comply</text>
  </g>
</svg>
