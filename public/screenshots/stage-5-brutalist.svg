<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#121212; font-family: 'Courier New', monospace;">
  <defs>
    <!-- Hard drop shadow for brutalist panels -->
    <filter id="hardShadow" x="0" y="0" width="120%" height="120%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#0a0a0a"/>
    </filter>
    <radialGradient id="arcadeButtonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <pattern id="scanlines5" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="100" y2="1" stroke="#000000" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- 1. Top Instrument Bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#181818"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#3a3a3a" stroke-width="1"/>
  <text x="24" y="27" fill="#F59E0B" font-size="13" font-weight="900" letter-spacing="1">HALCYON // AUDIT_TERMINAL_0451 [INGSOC]</text>
  <text x="1176" y="27" fill="#8d8d8d" font-size="12" text-anchor="end">SYS_UPTIME: 00:14:38 // CLOCK: SYNCED</text>

  <!-- 2. Main 3-Column Layout -->
  
  <!-- LEFT COLUMN: Operator Log Panel -->
  <g transform="translate(30, 60)" filter="url(#hardShadow)">
    <rect x="0" y="0" width="310" height="540" fill="#202020" stroke="#3a3a3a" stroke-width="1"/>
    <!-- Header -->
    <text x="18" y="28" fill="#F59E0B" font-size="13" font-weight="900">OPERATOR LOG [LIVE]</text>
    <line x1="18" y1="40" x2="292" y2="40" stroke="#3a3a3a" stroke-dasharray="4 4"/>
    
    <!-- Log Entries (Newest top, older fading) -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" fill="#F3F4F6" font-size="11" font-weight="700">&gt; Subject 0451 blinked 14 times.</text>
      <text x="0" y="16" fill="#8d8d8d" font-size="9">THINKPOL_CORRECTION_PENDING</text>
      
      <text x="0" y="46" fill="#F3F4F6" font-size="11" opacity="0.9">&gt; Break taken without prior approval.</text>
      <text x="0" y="62" fill="#8d8d8d" font-size="9">ROOM_101_DISPATCH_ALERT</text>

      <text x="0" y="92" fill="#F3F4F6" font-size="11" opacity="0.8">&gt; Attention levels are satisfactory.</text>
      <text x="0" y="108" fill="#8d8d8d" font-size="9">MINITRUE_ARCHIVE_CONFIRMED</text>

      <text x="0" y="138" fill="#F3F4F6" font-size="11" opacity="0.65">&gt; Biometric eye vector calibrated.</text>
      <text x="0" y="154" fill="#8d8d8d" font-size="9">GAZE_TRACK_LOCKED_100%</text>

      <text x="0" y="184" fill="#F3F4F6" font-size="11" opacity="0.5">&gt; Unscheduled keypress logged: 0x4B</text>
      <text x="0" y="214" fill="#F3F4F6" font-size="11" opacity="0.35">&gt; Halcyon background daemon started.</text>
      <text x="0" y="244" fill="#F3F4F6" font-size="11" opacity="0.2">&gt; System initialized at 0% chaos.</text>
    </g>

    <!-- Terminal Command Line Prompt -->
    <rect x="14" y="490" width="282" height="34" fill="#141414" stroke="#333333"/>
    <text x="24" y="512" fill="#F59E0B" font-size="12">cmd: audit_presence_</text>
  </g>

  <!-- CENTER COLUMN: Title + Physical Arcade Amber Button -->
  <g transform="translate(370, 60)">
    <!-- Anton Condensed Headline with RGB split drop -->
    <text x="230" y="70" fill="#B45309" font-family="'Anton', Impact, sans-serif" font-size="58" font-weight="900" text-anchor="middle" letter-spacing="1">WE ARE WATCHING.</text>
    <text x="230" y="128" fill="#F59E0B" font-family="'Anton', Impact, sans-serif" font-size="58" font-weight="900" text-anchor="middle" letter-spacing="1">YOU ARE FOCUSED.</text>

    <text x="230" y="170" fill="#8d8d8d" font-size="12" text-anchor="middle">PRESS ARCADE KEY TO DISCHARGE COMPLIANCE PULSE</text>

    <!-- Large Physical Arcade Button -->
    <g transform="translate(230, 330)">
      <!-- Stepped hard shadow underneath button base -->
      <circle cx="9" cy="9" r="110" fill="#0A0A0A"/>
      <!-- Graphite Bezel Ring -->
      <circle cx="0" cy="0" r="110" fill="#202020" stroke="#3a3a3a" stroke-width="4"/>
      <circle cx="0" cy="0" r="98" fill="#121212" stroke="#252525" stroke-width="2"/>
      
      <!-- Amber Key Cap -->
      <circle cx="0" cy="0" r="90" fill="url(#arcadeButtonGrad)"/>
      <circle cx="0" cy="0" r="88" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.6"/>
      
      <!-- Inner text -->
      <text x="0" y="-8" fill="#121212" font-family="'Anton', Impact, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="2">SUBMIT</text>
      <text x="0" y="24" fill="#121212" font-family="'Anton', Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">COMPLIANCE</text>
    </g>

    <text x="230" y="525" fill="#F59E0B" font-size="11" text-anchor="middle" letter-spacing="2">[ SQUASH 0.92 ON CLICK • 83% DECAY REACHED ]</text>
  </g>

  <!-- RIGHT COLUMN: Entropy Panel (20-Segment Meter + Readout) -->
  <g transform="translate(860, 60)" filter="url(#hardShadow)">
    <rect x="0" y="0" width="310" height="540" fill="#202020" stroke="#3a3a3a" stroke-width="1"/>
    <!-- Header -->
    <text x="18" y="28" fill="#F59E0B" font-size="13" font-weight="900">ENTROPY / TELEMETRY</text>
    <line x1="18" y1="40" x2="292" y2="40" stroke="#3a3a3a" stroke-dasharray="4 4"/>

    <!-- Readout Metrics -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" fill="#8d8d8d" font-size="11">TOTAL_INPUTS:</text>
      <text x="250" y="0" fill="#F3F4F6" font-size="12" font-weight="700" text-anchor="end">05 / 06</text>

      <text x="0" y="24" fill="#8d8d8d" font-size="11">CHAOS_INDEX:</text>
      <text x="250" y="24" fill="#F59E0B" font-size="13" font-weight="900" text-anchor="end">83.3 %</text>

      <text x="0" y="48" fill="#8d8d8d" font-size="11">SYSTEM_STATE:</text>
      <text x="250" y="48" fill="#DC2626" font-size="11" font-weight="800" text-anchor="end">BRUTALIST</text>
    </g>

    <line x1="20" y1="130" x2="290" y2="130" stroke="#3a3a3a"/>

    <!-- 20-Segment Vertical LED Meter -->
    <g transform="translate(40, 150)">
      <text x="110" y="10" fill="#8d8d8d" font-size="10" text-anchor="middle">20-SEGMENT FLUID BAR</text>
      
      <!-- 20 Segments (from bottom to top, 17 lit) -->
      <!-- Top 3 unlit red segments -->
      <rect x="30" y="25" width="160" height="11" rx="1" fill="#221111" stroke="#331111"/>
      <rect x="30" y="40" width="160" height="11" rx="1" fill="#221111" stroke="#331111"/>
      <rect x="30" y="55" width="160" height="11" rx="1" fill="#221111" stroke="#331111"/>
      
      <!-- Lit warning & amber segments -->
      <rect x="30" y="70" width="160" height="11" rx="1" fill="#EF4444" stroke="#DC2626"/>
      <rect x="30" y="85" width="160" height="11" rx="1" fill="#F97316" stroke="#EA580C"/>
      <rect x="30" y="100" width="160" height="11" rx="1" fill="#F59E0B" stroke="#D97706"/>
      <rect x="30" y="115" width="160" height="11" rx="1" fill="#F59E0B" stroke="#D97706"/>
      <rect x="30" y="130" width="160" height="11" rx="1" fill="#F59E0B" stroke="#D97706"/>
      <rect x="30" y="145" width="160" height="11" rx="1" fill="#F59E0B" stroke="#D97706"/>
      <rect x="30" y="160" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="175" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="190" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="205" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="220" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="235" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="250" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="265" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="280" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="295" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
      <rect x="30" y="310" width="160" height="11" rx="1" fill="#FBBF24" stroke="#D97706"/>
    </g>

    <text x="155" y="505" fill="#DC2626" font-size="11" font-weight="900" text-anchor="middle">CRITICAL THRESHOLD: 1 MORE CLICK</text>
  </g>

  <!-- 3. Bottom Scrolling Ticker Footer -->
  <rect x="0" y="635" width="1200" height="40" fill="#181818"/>
  <line x1="0" y1="635" x2="1200" y2="635" stroke="#3a3a3a" stroke-width="1"/>
  <text x="12" y="660" fill="#F59E0B" font-size="12" font-weight="900">/// REUTERS // INGSOC TELEMETRY:</text>
  <text x="240" y="660" fill="#F3F4F6" font-size="12">WAR IS PEACE • FREEDOM IS SLAVERY • IGNORANCE IS STRENGTH • RECORD ARCHIVE OPERATIONAL • ATTENTION ALLOCATED: 100% •</text>

  <!-- Scanlines overlay -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#scanlines5)" pointer-events="none"/>
</svg>
