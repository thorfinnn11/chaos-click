<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0F0F0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- CRT scanlines overlay -->
    <pattern id="scanlines4" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="100" y2="2" stroke="#000000" stroke-width="1.2" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Shake & Distortion -->
  <g transform="translate(6, -4) rotate(-0.5 600 337)">
    <!-- Top Nav -->
    <rect x="0" y="0" width="1200" height="65" fill="#141414"/>
    <line x1="0" y1="65" x2="1200" y2="65" stroke="#3a3a3a" stroke-width="1"/>
    <text x="60" y="42" fill="#F59E0B" font-size="22" font-weight="900" letter-spacing="2">HALCYON // 1984</text>
    <rect x="230" y="24" width="180" height="24" rx="4" fill="#3D1A00" stroke="#DC2626"/>
    <text x="240" y="40" fill="#FCA5A5" font-size="11" font-weight="800">ALERT: CHAOS 67% // EVASION</text>

    <!-- Eyebrow -->
    <rect x="380" y="95" width="440" height="30" rx="4" fill="#221105" stroke="#B45309"/>
    <text x="600" y="115" fill="#F59E0B" font-size="11" font-weight="800" letter-spacing="2" text-anchor="middle">RESOURCE ALLOCATION // COMPLIANCE DIRECTIVE</text>

    <!-- Giant Brutalist Headline -->
    <text x="596" y="172" fill="#B45309" font-size="44" font-weight="900" text-anchor="middle">Attention is a resource. We allocate it.</text>
    <text x="600" y="170" fill="#F59E0B" font-size="44" font-weight="900" text-anchor="middle">Attention is a resource. We allocate it.</text>

    <!-- Subheadline -->
    <text x="600" y="210" fill="#D1D5DB" font-size="15" text-anchor="middle">Unscheduled pauses will be investigated. Unallocated minutes represent lost enterprise capital.</text>

    <!-- Evasive CTA Button (Offset fleeing from cursor) -->
    <g transform="translate(680, 240)">
      <!-- Motion streak/trail -->
      <rect x="-80" y="5" width="160" height="42" rx="4" fill="#B45309" opacity="0.3"/>
      <rect x="-40" y="2" width="160" height="42" rx="4" fill="#F59E0B" opacity="0.5"/>
      <rect x="0" y="0" width="170" height="46" rx="4" fill="#DC2626" stroke="#FEF08A" stroke-width="2"/>
      <text x="85" y="29" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">COMPLY [RUNNING]</text>
    </g>

    <!-- Simulated Cursor hovering where button used to be -->
    <g transform="translate(480, 255)">
      <path d="M 0 0 L 16 16 L 9 17 L 13 26 L 8 28 L 4 19 L 0 23 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#F59E0B" stroke-dasharray="3 3"/>
      <text x="26" y="12" fill="#F59E0B" font-size="10" font-family="monospace">CURSOR: MISSED (BUTTON DODGED)</text>
    </g>

    <!-- Cards Transformed -->
    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="340" height="135" rx="2" fill="#181818" stroke="#444444"/>
      <text x="24" y="32" fill="#DC2626" font-size="15" font-weight="800">Assigned time</text>
      <text x="24" y="65" fill="#9CA3AF" font-size="12">Unscheduled pauses will be investigated</text>
      <text x="24" y="85" fill="#9CA3AF" font-size="12">immediately by regional compliance officers.</text>

      <rect x="370" y="0" width="340" height="135" rx="2" fill="#181818" stroke="#444444"/>
      <text x="394" y="32" fill="#DC2626" font-size="15" font-weight="800">Interviews</text>
      <text x="394" y="65" fill="#9CA3AF" font-size="12">Clarification sessions scheduled</text>
      <text x="394" y="85" fill="#9CA3AF" font-size="12">automatically in Room 101.</text>

      <rect x="740" y="0" width="340" height="135" rx="2" fill="#181818" stroke="#444444"/>
      <text x="764" y="32" fill="#DC2626" font-size="15" font-weight="800">Dossiers</text>
      <text x="764" y="65" fill="#9CA3AF" font-size="12">Permanent behavioral index generated.</text>
      <text x="764" y="85" fill="#9CA3AF" font-size="12">All ocular and neural discrepancies logged.</text>
    </g>

    <!-- Testimonial with Mask Slipping -->
    <g transform="translate(200, 505)">
      <rect x="0" y="0" width="800" height="85" rx="4" fill="#1A1510" stroke="#B45309"/>
      <text x="400" y="36" fill="#FEF08A" font-size="16" font-weight="700" text-anchor="middle">"I have never felt so observed. I mean supported."</text>
      <text x="400" y="62" fill="#9CA3AF" font-size="12" font-family="monospace" text-anchor="middle">— Subject 418, Fieldstone Unit (Correction Index: #9204)</text>
    </g>
  </g>

  <!-- Horizontal Difference Tear Bar -->
  <rect x="0" y="295" width="1200" height="8" fill="#F59E0B" opacity="0.6"/>

  <!-- Click Debris Scatter -->
  <text x="630" y="245" fill="#F59E0B" font-size="14" font-weight="900">%</text>
  <text x="720" y="235" fill="#FEF08A" font-size="14" font-weight="900">#</text>
  <text x="810" y="295" fill="#B45309" font-size="14" font-weight="900">?!</text>
  <text x="560" y="280" fill="#EF4444" font-size="14" font-weight="900">×</text>

  <!-- Scanlines overlay -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#scanlines4)" pointer-events="none"/>
</svg>
