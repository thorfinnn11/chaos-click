<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halcyon // Remote Team Focus &amp; Wellbeing Analytics</title>
    <meta name="description" content="Halcyon shows where attention goes during the workday and nudges people toward deep work, with calm check-ins instead of constant pings." />
    <meta property="og:title" content="Halcyon // Remote Team Focus &amp; Wellbeing Analytics" />
    <meta property="og:description" content="Halcyon shows where attention goes during the workday and nudges people toward deep work, with calm check-ins instead of constant pings." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#121316] text-[#f3f4f6] antialiased select-none selection:bg-[#ffb000] selection:text-black">
    <!-- SVG Distortion Filter for Real Glitch Effects -->
    <svg class="hidden" width="0" height="0">
      <defs>
        <filter id="chaos-displacement">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.95" numOctaves="2" result="noise" id="turbulence-node" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" id="displacement-node" />
        </filter>
        <filter id="heavy-distortion">
          <feTurbulence type="turbulence" baseFrequency="0.08 0.02" numOctaves="3" result="turb" />
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="28" xChannelSelector="R" yChannelSelector="B" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
